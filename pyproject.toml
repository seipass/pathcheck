[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pathcheck"
version = "0.1.0"
description = "Check paths and report filesystem metadata."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
[project.scripts]
pathcheck = "pathcheck.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
